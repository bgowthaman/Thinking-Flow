<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thinking Flow v2.0 | Mind Map & Git-Track Workspace</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <style>
    :root {
      --bg-canvas: #0f172a;
      --bg-panel: #1e293b;
      --bg-card: #273549;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --grid-dot: rgba(148, 163, 184, 0.15);
    }

    body.light-theme {
      --bg-canvas: #f1f5f9;
      --bg-panel: #ffffff;
      --bg-card: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --grid-dot: rgba(100, 116, 139, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-canvas); color: var(--text-main); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

    /* Top Toolbar */
    .topbar {
      height: 54px; background: var(--bg-panel); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 14px; z-index: 20; gap: 8px;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1rem; color: var(--accent); white-space: nowrap; }
    .toolbar-group { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; overflow-x: auto; }
    
    button, select, input[type="text"], input[type="password"] {
      background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; transition: 0.15s;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #0f172a; font-weight: 600; border: none; }
    button.primary:hover { background: var(--accent-hover); color: #fff; }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button.danger:hover { background: var(--danger); color: #fff; }
    button.success { border-color: var(--success); color: var(--success); }
    button.success:hover { background: var(--success); color: #0f172a; }

    /* Map Tab & Metadata Bar */
    .map-meta-bar {
      height: 36px; background: var(--bg-card); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 0.78rem; z-index: 19;
    }
    .map-tabs-scroll { display: flex; align-items: center; gap: 6px; overflow-x: auto; max-width: 55%; }
    .map-tab {
      padding: 3px 10px; border-radius: 4px; background: var(--bg-panel); border: 1px solid var(--border);
      cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px;
    }
    .map-tab.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .map-timestamps { color: var(--text-muted); display: flex; gap: 14px; white-space: nowrap; }

    /* Main Workspace */
    .workspace { position: relative; flex: 1; overflow: hidden; }
    #canvas-container {
      width: 100%; height: 100%; position: relative; cursor: grab;
      background-image: radial-gradient(var(--grid-dot) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }
    #canvas-container:active { cursor: grabbing; }
    #viewport { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
    #connections-svg { position: absolute; top: 0; left: 0; width: 8000px; height: 8000px; pointer-events: none; overflow: visible; }

    /* Mind Map Nodes */
    .mm-node {
      position: absolute; min-width: 150px; max-width: 260px; background: var(--bg-panel);
      border: 2px solid var(--accent); border-radius: 10px; padding: 10px 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.28); cursor: pointer; user-select: none; transition: box-shadow 0.15s;
    }
    .mm-node.selected { box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.45), 0 8px 22px rgba(0,0,0,0.4); }
    .mm-node.search-match { outline: 3px solid var(--warning); }
    .node-header { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 4px; }
    .node-badge { font-size: 0.68rem; padding: 2px 6px; border-radius: 4px; background: rgba(56,189,248,0.18); color: var(--accent); font-weight: 600; }
    .node-title { font-weight: 600; font-size: 0.9rem; word-break: break-word; }
    .node-indicators { display: flex; gap: 6px; margin-top: 6px; font-size: 0.72rem; color: var(--text-muted); }

    /* Slide-over Editor Drawer */
    .drawer {
      position: absolute; top: 0; right: -440px; width: 420px; max-width: 95vw; height: 100%;
      background: var(--bg-panel); border-left: 1px solid var(--border); z-index: 30;
      display: flex; flex-direction: column; transition: right 0.25s ease; box-shadow: -6px 0 24px rgba(0,0,0,0.35);
    }
    .drawer.open { right: 0; }
    .drawer-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .drawer-tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg-card); }
    .d-tab { flex: 1; text-align: center; padding: 8px 4px; font-size: 0.78rem; cursor: pointer; border-bottom: 2px solid transparent; }
    .d-tab.active { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .tab-pane { display: none; flex-direction: column; gap: 10px; }
    .tab-pane.active { display: flex; }

    label { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }
    textarea {
      width: 100%; background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px; font-size: 0.84rem; resize: vertical;
    }
    .code-area { font-family: 'Consolas', 'Courier New', monospace; min-height: 150px; }
    .img-preview { max-width: 100%; border-radius: 6px; border: 1px solid var(--border); margin-top: 6px; }

    /* Git Track Log List */
    .git-log-item {
      background: var(--bg-card); border-left: 3px solid var(--accent); padding: 8px 10px;
      border-radius: 4px; font-size: 0.8rem; display: flex; flex-direction: column; gap: 3px;
    }
    .git-meta { font-size: 0.7rem; color: var(--text-muted); display: flex; justify-content: space-between; }

    /* Modals */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none;
      align-items: center; justify-content: center; z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px;
      width: 520px; max-width: 94vw; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
    .modal-body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .list-row {
      display: flex; justify-content: space-between; align-items: center; padding: 8px 10px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; gap: 8px;
    }
    .floating-controls {
      position: absolute; bottom: 16px; left: 16px; display: flex; gap: 6px; z-index: 15;
      background: var(--bg-panel); padding: 6px; border-radius: 8px; border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- Top Toolbar -->
  <div class="topbar">
    <div class="brand">🧠 Thinking Flow <span style="font-size:0.72rem;opacity:0.8;">v2.0</span></div>
    
    <div class="toolbar-group">
      <button class="primary" onclick="App.createNewMap()">+ New Map / புதியது</button>
      <button onclick="App.openMapManager()">📂 Open Map / திற</button>
      <button class="danger" onclick="App.deleteCurrentMap()">🗑️ Delete Tab</button>
      <button onclick="App.openRestoreModal()">♻️ Restore (<span id="trash-count">0</span>)</button>
    </div>

    <div class="toolbar-group">
      <input type="text" id="search-input" placeholder="🔍 Search nodes..." oninput="App.searchNodes(this.value)" style="width:140px;" />
      <select id="layout-select" onchange="App.applyLayout(this.value)">
        <option value="freeform">Layout: Freeform</option>
        <option value="tree">Layout: Tree</option>
        <option value="radial">Layout: Radial</option>
      </select>
      <button onclick="App.openCloudModal()">☁️ Cloud & Backup</button>
      <button onclick="App.toggleTheme()">🌓</button>
    </div>
  </div>

  <!-- Map Tabs & Date/Time Metadata Bar -->
  <div class="map-meta-bar">
    <div class="map-tabs-scroll" id="map-tabs-list"></div>
    <div class="map-timestamps" id="map-timestamps-display">
      <span>Created: --</span>
      <span>Modified: --</span>
    </div>
  </div>

  <!-- Main Canvas Workspace -->
  <div class="workspace">
    <div id="canvas-container">
      <div id="viewport">
        <svg id="connections-svg"></svg>
        <div id="nodes-layer"></div>
      </div>
    </div>

    <!-- Bottom Left Quick Actions -->
    <div class="floating-controls">
      <button onclick="App.addChildNode()">+ Child (Tab)</button>
      <button onclick="App.addSiblingNode()">+ Sibling (Enter)</button>
      <button onclick="App.zoom(0.1)">➕</button>
      <button onclick="App.zoom(-0.1)">➖</button>
      <button onclick="App.resetView()">🎯 Center</button>
    </div>

    <!-- Right Slide-over Node Editor Drawer -->
    <div class="drawer" id="node-drawer">
      <div class="drawer-header">
        <strong id="drawer-node-title">Edit Node / கிளை திருத்தம்</strong>
        <button onclick="App.closeDrawer()">✕</button>
      </div>
      <div class="drawer-tabs">
        <div class="d-tab active" onclick="App.switchDrawerTab('general', this)">📝 Notes</div>
        <div class="d-tab" onclick="App.switchDrawerTab('code', this)">💻 Code</div>
        <div class="d-tab" onclick="App.switchDrawerTab('media', this)">🖼️ Media</div>
        <div class="d-tab" onclick="App.switchDrawerTab('git', this)">🔀 Git Track</div>
      </div>

      <div class="drawer-body">
        <!-- Tab 1: General & Notes -->
        <div class="tab-pane active" id="pane-general">
          <label>Node Title / தலைப்பு</label>
          <input type="text" id="edit-title" oninput="App.updateSelectedNode('title', this.value)" />

          <div style="display:flex; gap:8px;">
            <div style="flex:1;">
              <label>Status / நிலை</label>
              <select id="edit-status" style="width:100%;" onchange="App.updateSelectedNode('status', this.value)">
                <option value="Idea">💡 Idea / யோசனை</option>
                <option value="In Progress">⚡ In Progress / செயல்பாட்டில்</option>
                <option value="Code">💻 Code / நிரல்</option>
                <option value="Hardware">🔌 Hardware / வன்பொருள்</option>
                <option value="Research">🔬 Research / ஆய்வு</option>
                <option value="Done">✅ Done / முடிந்தது</option>
              </select>
            </div>
            <div>
              <label>Color / நிறம்</label><br/>
              <input type="color" id="edit-color" value="#38bdf8" onchange="App.updateSelectedNode('color', this.value)" style="height:32px;width:54px;padding:2px;" />
            </div>
          </div>

          <label>Markdown Notes / விரிவான குறிப்புகள்</label>
          <textarea id="edit-notes" rows="8" placeholder="Write project ideas, formulas, or steps..." oninput="App.updateSelectedNode('notes', this.value)"></textarea>

          <button class="danger" onclick="App.deleteSelectedNode()" style="margin-top:8px;">🗑️ Move Node to Restore Bin</button>
        </div>

        <!-- Tab 2: Code & Program Language Selector -->
        <div class="tab-pane" id="pane-code">
          <label>Select Program / Language (நிரலாக்க மொழி)</label>
          <div style="display:flex; gap:6px;">
            <select id="edit-code-lang" style="flex:1;" onchange="App.updateSelectedNode('codeLang', this.value)"></select>
            <button onclick="App.addManualLanguage()" title="Add custom language">+ Manual</button>
          </div>

          <label>Code Snippet / நிரல் குறியீடு</label>
          <textarea id="edit-code" class="code-area" placeholder="// Paste or write your code here..." oninput="App.updateSelectedNode('code', this.value)"></textarea>
          
          <div style="display:flex; gap:6px;">
            <button onclick="App.copyNodeCode()">📋 Copy Code</button>
            <button onclick="App.previewHighlightedCode()">👁️ Highlight Preview</button>
          </div>
          <pre id="code-preview-box" style="display:none; border-radius:6px; overflow-x:auto; font-size:0.78rem;"><code id="code-preview-content"></code></pre>
        </div>

        <!-- Tab 3: Pictures & Attachments -->
        <div class="tab-pane" id="pane-media">
          <label>Image URL / படத்தின் இணைப்பு</label>
          <input type="text" id="edit-img-url" placeholder="https://..." oninput="App.updateSelectedNode('image', this.value)" />

          <label>Or Upload Image / படம் பதிவேற்றவும் (Auto-Compressed)</label>
          <input type="file" accept="image/*" onchange="App.handleImageUpload(event)" />

          <img id="edit-img-preview" class="img-preview" style="display:none;" />
          <button class="danger" id="remove-img-btn" style="display:none;" onclick="App.removeNodeImage()">Remove Image</button>
        </div>

        <!-- Tab 4: Git-Style Idea & Program Track Notes -->
        <div class="tab-pane" id="pane-git">
          <label>Commit / Track Note (மாற்றம் / யோசனை பதிவு)</label>
          <div style="display:flex; gap:6px;">
            <select id="git-commit-type">
              <option value="feat">✨ feat (Idea/Feature)</option>
              <option value="code">💻 code (Program Update)</option>
              <option value="fix">🐛 fix (Bug/Circuit Fix)</option>
              <option value="note">📝 note (Thinking Log)</option>
            </select>
            <input type="text" id="git-commit-msg" placeholder="e.g., Added Quad-4 MUX logic..." style="flex:1;" />
          </div>
          <button class="primary" onclick="App.addGitTrackNote()">📌 Commit Track Note</button>

          <label style="margin-top:6px;">History Log / மாற்றங்களின் வரலாறு</label>
          <div id="git-history-list" style="display:flex; flex-direction:column; gap:6px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Open Map Manager -->
  <div class="modal-backdrop" id="map-manager-modal">
    <div class="modal">
      <div class="modal-header">
        <span>📂 Open / Manage Maps (வரைபடங்கள்)</span>
        <button onclick="App.closeModal('map-manager-modal')">✕</button>
      </div>
      <div class="modal-body" id="map-manager-list"></div>
    </div>
  </div>

  <!-- Modal: Restore Bin (Deleted Tabs & Nodes) -->
  <div class="modal-backdrop" id="restore-modal">
    <div class="modal">
      <div class="modal-header">
        <span>♻️ Restore Bin (நீக்கப்பட்டவை மீட்டெடுப்பு)</span>
        <button onclick="App.closeModal('restore-modal')">✕</button>
      </div>
      <div class="modal-body">
        <p style="font-size:0.78rem; color:var(--text-muted);">Deleted Maps (Tabs) and Nodes can be restored anytime.</p>
        <div id="restore-list" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>
    </div>
  </div>

  <!-- Modal: Cloud & Backup (JSON, Firebase, Google Drive) -->
  <div class="modal-backdrop" id="cloud-modal">
    <div class="modal">
      <div class="modal-header">
        <span>☁️ Cloud Sync & Local Backup</span>
        <button onclick="App.closeModal('cloud-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div style="display:flex; gap:8px;">
          <button class="primary" onclick="App.exportJSON()">⬇️ Export JSON</button>
          <button onclick="document.getElementById('import-json-input').click()">⬆️ Import JSON</button>
          <input type="file" id="import-json-input" accept=".json" style="display:none;" onchange="App.importJSON(event)" />
        </div>
        <hr style="border-color:var(--border);" />
        <label>Firebase Web Config (JSON)</label>
        <textarea id="firebase-config-input" rows="3" placeholder='{"apiKey":"...","projectId":"..."}'></textarea>
        <button onclick="App.saveCloudConfig()">💾 Save Cloud Settings</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    const App = {
      state: {
        maps: [],
        activeMapId: null,
        trash: [], // Stores deleted maps & deleted nodes
        languages: [
          "JavaScript", "Python", "HTML", "CSS", "C", "C++", "Verilog",
          "Java", "SQL", "Bash / Termux", "Arduino / ESP", "JSON", "Markdown"
        ],
        selectedNodeId: null,
        pan: { x: 80, y: 80 },
        zoom: 1,
        theme: 'dark'
      },

      init() {
        const saved = localStorage.getItem('thinking_flow_v2');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            Object.assign(this.state, parsed);
          } catch (e) { console.error(e); }
        }
        if (!this.state.maps || this.state.maps.length === 0) {
          this.createNewMap("Main Thinking Flow", true);
        } else if (!this.state.activeMapId) {
          this.state.activeMapId = this.state.maps[0].id;
        }
        if (this.state.theme === 'light') document.body.classList.add('light-theme');
        this.populateLanguageDropdown();
        this.bindCanvasEvents();
        this.bindKeyboardShortcuts();
        this.renderAll();
      },

      saveState() {
        localStorage.setItem('thinking_flow_v2', JSON.stringify(this.state));
        document.getElementById('trash-count').textContent = this.state.trash.length;
      },

      nowFormatted() {
        const d = new Date();
        return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) +
               ' ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      },

      getActiveMap() {
        return this.state.maps.find(m => m.id === this.state.activeMapId) || this.state.maps[0];
      },

      touchMapModified() {
        const map = this.getActiveMap();
        if (map) {
          map.modifiedAt = this.nowFormatted();
          this.updateTimestampUI();
        }
      },

      // 1. New Map / Open Map / Delete Tab / Restore
      createNewMap(customTitle = null, skipPrompt = false) {
        let title = customTitle;
        if (!skipPrompt) {
          title = prompt("Enter New Map Name / புதிய வரைபடத்தின் பெயர்:", `Project Flow ${this.state.maps.length + 1}`);
          if (!title) return;
        }
        const now = this.nowFormatted();
        const newMap = {
          id: 'map_' + Date.now(),
          title: title.trim(),
          createdAt: now,
          modifiedAt: now,
          nodes: [
            {
              id: 'node_root_' + Date.now(),
              parentId: null,
              title: title.trim(),
              status: 'Idea',
              color: '#38bdf8',
              x: 220, y: 180,
              notes: '', code: '', codeLang: 'Python', image: '',
              gitLogs: [{ type: 'feat', msg: 'Initialized map root', time: now }]
            }
          ]
        };
        this.state.maps.push(newMap);
        this.state.activeMapId = newMap.id;
        this.state.selectedNodeId = null;
        this.closeDrawer();
        this.saveState();
        this.renderAll();
      },

      switchMap(mapId) {
        this.state.activeMapId = mapId;
        this.state.selectedNodeId = null;
        this.closeDrawer();
        this.saveState();
        this.renderAll();
      },

      deleteCurrentMap() {
        if (this.state.maps.length <= 1) {
          alert("At least one active map must remain. Create a new map before deleting this one.");
          return;
        }
        const map = this.getActiveMap();
        if (!confirm(`Move "${map.title}" to Restore Bin?`)) return;

        this.state.trash.unshift({
          trashId: 'tr_' + Date.now(),
          itemType: 'MAP',
          deletedAt: this.nowFormatted(),
          data: JSON.parse(JSON.stringify(map))
        });

        this.state.maps = this.state.maps.filter(m => m.id !== map.id);
        this.state.activeMapId = this.state.maps[0].id;
        this.state.selectedNodeId = null;
        this.closeDrawer();
        this.saveState();
        this.renderAll();
      },

      openMapManager() {
        const list = document.getElementById('map-manager-list');
        list.innerHTML = '';
        this.state.maps.forEach(m => {
          const row = document.createElement('div');
          row.className = 'list-row';
          row.innerHTML = `
            <div>
              <strong>${this.escapeHTML(m.title)}</strong>
              <div style="font-size:0.72rem;color:var(--text-muted);">
                Created: ${m.createdAt} | Modified: ${m.modifiedAt} | Nodes: ${m.nodes.length}
              </div>
            </div>
            <div style="display:flex;gap:6px;">
              <button class="primary" onclick="App.switchMap('${m.id}');App.closeModal('map-manager-modal');">Open</button>
              <button onclick="App.renameMap('${m.id}')">✏️</button>
            </div>
          `;
          list.appendChild(row);
        });
        document.getElementById('map-manager-modal').classList.add('open');
      },

      renameMap(mapId) {
        const m = this.state.maps.find(x => x.id === mapId);
        if (!m) return;
        const name = prompt("Rename Map:", m.title);
        if (name && name.trim()) {
          m.title = name.trim();
          m.modifiedAt = this.nowFormatted();
          this.saveState();
          this.renderAll();
          this.openMapManager();
        }
      },

      openRestoreModal() {
        const list = document.getElementById('restore-list');
        list.innerHTML = '';
        if (this.state.trash.length === 0) {
          list.innerHTML = '<div style="color:var(--text-muted);font-size:0.84rem;">Restore bin is empty.</div>';
        } else {
          this.state.trash.forEach(item => {
            const row = document.createElement('div');
            row.className = 'list-row';
            const label = item.itemType === 'MAP'
              ? `🗂️ Map: ${item.data.title}`
              : `🔹 Node: ${item.data.title} (from ${item.mapTitle || 'Map'})`;
            row.innerHTML = `
              <div>
                <strong>${this.escapeHTML(label)}</strong>
                <div style="font-size:0.72rem;color:var(--text-muted);">Deleted: ${item.deletedAt}</div>
              </div>
              <div style="display:flex;gap:6px;">
                <button class="success" onclick="App.restoreTrashItem('${item.trashId}')">♻️ Restore</button>
                <button class="danger" onclick="App.purgeTrashItem('${item.trashId}')">✕</button>
              </div>
            `;
            list.appendChild(row);
          });
        }
        document.getElementById('restore-modal').classList.add('open');
      },

      restoreTrashItem(trashId) {
        const idx = this.state.trash.findIndex(t => t.trashId === trashId);
        if (idx === -1) return;
        const item = this.state.trash[idx];

        if (item.itemType === 'MAP') {
          item.data.modifiedAt = this.nowFormatted();
          this.state.maps.push(item.data);
          this.state.activeMapId = item.data.id;
        } else if (item.itemType === 'NODE') {
          const targetMap = this.state.maps.find(m => m.id === item.mapId) || this.getActiveMap();
          // Ensure parent still exists; if not, attach to root
          if (item.data.parentId && !targetMap.nodes.some(n => n.id === item.data.parentId)) {
            item.data.parentId = targetMap.nodes[0]?.id || null;
          }
          targetMap.nodes.push(item.data);
          targetMap.modifiedAt = this.nowFormatted();
          this.state.activeMapId = targetMap.id;
        }

        this.state.trash.splice(idx, 1);
        this.saveState();
        this.renderAll();
        this.openRestoreModal();
      },

      purgeTrashItem(trashId) {
        this.state.trash = this.state.trash.filter(t => t.trashId !== trashId);
        this.saveState();
        this.openRestoreModal();
      },

      // 2. Programs / Languages & Manual Add
      populateLanguageDropdown() {
        const sel = document.getElementById('edit-code-lang');
        sel.innerHTML = '';
        this.state.languages.forEach(lang => {
          const opt = document.createElement('option');
          opt.value = lang;
          opt.textContent = lang;
          sel.appendChild(opt);
        });
      },

      addManualLanguage() {
        const custom = prompt("Enter Program / Language Name (e.g., Rust, Go, Assembly, TCL):");
        if (!custom || !custom.trim()) return;
        const clean = custom.trim();
        if (!this.state.languages.includes(clean)) {
          this.state.languages.push(clean);
        }
        this.populateLanguageDropdown();
        document.getElementById('edit-code-lang').value = clean;
        this.updateSelectedNode('codeLang', clean);
        this.saveState();
      },

      // 3. Git-Style Track Notes
      addGitTrackNote() {
        const node = this.getSelectedNode();
        if (!node) return;
        const msgInput = document.getElementById('git-commit-msg');
        const type = document.getElementById('git-commit-type').value;
        const msg = msgInput.value.trim();
        if (!msg) return;

        if (!node.gitLogs) node.gitLogs = [];
        node.gitLogs.unshift({
          type,
          msg,
          time: this.nowFormatted()
        });
        msgInput.value = '';
        this.touchMapModified();
        this.saveState();
        this.renderGitLogs(node);
        this.renderNodes();
      },

      renderGitLogs(node) {
        const list = document.getElementById('git-history-list');
        list.innerHTML = '';
        const logs = node.gitLogs || [];
        if (logs.length === 0) {
          list.innerHTML = '<div style="font-size:0.78rem;color:var(--text-muted);">No track commits yet.</div>';
          return;
        }
        logs.forEach(log => {
          const div = document.createElement('div');
          div.className = 'git-log-item';
          div.innerHTML = `
            <div class="git-meta">
              <strong style="color:var(--accent);">[${this.escapeHTML(log.type)}]</strong>
              <span>${log.time}</span>
            </div>
            <div>${this.escapeHTML(log.msg)}</div>
          `;
          list.appendChild(div);
        });
      },

      // 4. Node Operations & Rendering
      getSelectedNode() {
        const map = this.getActiveMap();
        return map ? map.nodes.find(n => n.id === this.state.selectedNodeId) : null;
      },

      addChildNode() {
        const map = this.getActiveMap();
        const parent = this.getSelectedNode() || map.nodes[0];
        if (!parent) return;

        const now = this.nowFormatted();
        const newNode = {
          id: 'node_' + Date.now(),
          parentId: parent.id,
          title: 'New Idea / கிளை',
          status: 'Idea',
          color: parent.color || '#38bdf8',
          x: parent.x + 240,
          y: parent.y + (Math.random() * 120 - 60),
          notes: '', code: '', codeLang: 'Python', image: '',
          gitLogs: [{ type: 'feat', msg: 'Created branch node', time: now }]
        };
        map.nodes.push(newNode);
        this.touchMapModified();
        this.saveState();
        this.renderAll();
        this.selectNode(newNode.id);
      },

      addSiblingNode() {
        const map = this.getActiveMap();
        const current = this.getSelectedNode();
        if (!current || !current.parentId) {
          this.addChildNode();
          return;
        }
        const now = this.nowFormatted();
        const newNode = {
          id: 'node_' + Date.now(),
          parentId: current.parentId,
          title: 'Sibling Node',
          status: 'Idea',
          color: current.color || '#38bdf8',
          x: current.x,
          y: current.y + 110,
          notes: '', code: '', codeLang: 'Python', image: '',
          gitLogs: [{ type: 'feat', msg: 'Created sibling node', time: now }]
        };
        map.nodes.push(newNode);
        this.touchMapModified();
        this.saveState();
        this.renderAll();
        this.selectNode(newNode.id);
      },

      deleteSelectedNode() {
        const map = this.getActiveMap();
        const node = this.getSelectedNode();
        if (!node) return;
        if (!node.parentId) {
          alert("Root node cannot be deleted. You can delete the map tab instead.");
          return;
        }

        // Move node to Restore Bin
        this.state.trash.unshift({
          trashId: 'tr_' + Date.now(),
          itemType: 'NODE',
          mapId: map.id,
          mapTitle: map.title,
          deletedAt: this.nowFormatted(),
          data: JSON.parse(JSON.stringify(node))
        });

        // Re-parent children to deleted node's parent so nothing is lost
        map.nodes.forEach(n => {
          if (n.parentId === node.id) n.parentId = node.parentId;
        });
        map.nodes = map.nodes.filter(n => n.id !== node.id);
        this.state.selectedNodeId = null;
        this.closeDrawer();
        this.touchMapModified();
        this.saveState();
        this.renderAll();
      },

      selectNode(nodeId) {
        this.state.selectedNodeId = nodeId;
        const node = this.getSelectedNode();
        if (!node) return;

        document.getElementById('drawer-node-title').textContent = node.title;
        document.getElementById('edit-title').value = node.title;
        document.getElementById('edit-status').value = node.status || 'Idea';
        document.getElementById('edit-color').value = node.color || '#38bdf8';
        document.getElementById('edit-notes').value = node.notes || '';
        
        if (node.codeLang && !this.state.languages.includes(node.codeLang)) {
          this.state.languages.push(node.codeLang);
          this.populateLanguageDropdown();
        }
        document.getElementById('edit-code-lang').value = node.codeLang || 'Python';
        document.getElementById('edit-code').value = node.code || '';
        document.getElementById('code-preview-box').style.display = 'none';

        document.getElementById('edit-img-url').value = node.image || '';
        const imgPrev = document.getElementById('edit-img-preview');
        const remBtn = document.getElementById('remove-img-btn');
        if (node.image) {
          imgPrev.src = node.image;
          imgPrev.style.display = 'block';
          remBtn.style.display = 'inline-block';
        } else {
          imgPrev.style.display = 'none';
          remBtn.style.display = 'none';
        }

        this.renderGitLogs(node);
        document.getElementById('node-drawer').classList.add('open');
        this.renderNodes();
      },

      updateSelectedNode(field, value) {
        const node = this.getSelectedNode();
        if (!node) return;
        node[field] = value;
        if (field === 'title') document.getElementById('drawer-node-title').textContent = value;
        if (field === 'image') {
          const imgPrev = document.getElementById('edit-img-preview');
          const remBtn = document.getElementById('remove-img-btn');
          imgPrev.src = value;
          imgPrev.style.display = value ? 'block' : 'none';
          remBtn.style.display = value ? 'inline-block' : 'none';
        }
        this.touchMapModified();
        this.saveState();
        this.renderNodes();
        this.renderConnections();
      },

      closeDrawer() {
        document.getElementById('node-drawer').classList.remove('open');
        this.state.selectedNodeId = null;
        this.renderNodes();
      },

      switchDrawerTab(tabName, el) {
        document.querySelectorAll('.d-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('pane-' + tabName).classList.add('active');
      },

      // Image Upload with Canvas Compression
      handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxW = 600;
            const scale = Math.min(1, maxW / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            const compressed = canvas.toDataURL('image/jpeg', 0.75);
            document.getElementById('edit-img-url').value = compressed;
            this.updateSelectedNode('image', compressed);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      },

      removeNodeImage() {
        document.getElementById('edit-img-url').value = '';
        this.updateSelectedNode('image', '');
      },

      copyNodeCode() {
        const code = document.getElementById('edit-code').value;
        navigator.clipboard.writeText(code);
        alert("Code copied to clipboard!");
      },

      previewHighlightedCode() {
        const code = document.getElementById('edit-code').value;
        const box = document.getElementById('code-preview-box');
        const content = document.getElementById('code-preview-content');
        content.textContent = code;
        box.style.display = 'block';
        if (window.hljs) hljs.highlightElement(content);
      },

      // Layouts (Tree / Radial / Freeform)
      applyLayout(mode) {
        const map = this.getActiveMap();
        if (!map || mode === 'freeform') return;
        const root = map.nodes[0];
        if (!root) return;

        if (mode === 'tree') {
          let yCursor = 80;
          const placeTree = (nodeId, depth) => {
            const node = map.nodes.find(n => n.id === nodeId);
            if (!node) return;
            const children = map.nodes.filter(n => n.parentId === nodeId);
            node.x = 100 + depth * 280;
            if (children.length === 0) {
              node.y = yCursor;
              yCursor += 120;
            } else {
              children.forEach(c => placeTree(c.id, depth + 1));
              node.y = (children[0].y + children[children.length - 1].y) / 2;
            }
          };
          placeTree(root.id, 0);
        } else if (mode === 'radial') {
          root.x = 450; root.y = 320;
          const children = map.nodes.filter(n => n.parentId === root.id);
          children.forEach((c, i) => {
            const angle = (2 * Math.PI * i) / Math.max(1, children.length);
            c.x = root.x + Math.cos(angle) * 260;
            c.y = root.y + Math.sin(angle) * 220;
          });
        }
        this.touchMapModified();
        this.saveState();
        this.renderNodes();
        this.renderConnections();
      },

      // Rendering Functions
      renderAll() {
        this.renderMapTabs();
        this.updateTimestampUI();
        this.renderNodes();
        this.renderConnections();
        this.applyTransform();
        document.getElementById('trash-count').textContent = this.state.trash.length;
      },

      renderMapTabs() {
        const container = document.getElementById('map-tabs-list');
        container.innerHTML = '';
        this.state.maps.forEach(m => {
          const tab = document.createElement('div');
          tab.className = 'map-tab' + (m.id === this.state.activeMapId ? ' active' : '');
          tab.textContent = m.title;
          tab.onclick = () => this.switchMap(m.id);
          container.appendChild(tab);
        });
      },

      updateTimestampUI() {
        const map = this.getActiveMap();
        if (!map) return;
        document.getElementById('map-timestamps-display').innerHTML = `
          <span>📅 Created: <strong>${map.createdAt}</strong></span>
          <span>🕒 Modified: <strong>${map.modifiedAt}</strong></span>
        `;
      },

      renderNodes() {
        const layer = document.getElementById('nodes-layer');
        layer.innerHTML = '';
        const map = this.getActiveMap();
        if (!map) return;

        map.nodes.forEach(node => {
          const el = document.createElement('div');
          el.className = 'mm-node' + (node.id === this.state.selectedNodeId ? ' selected' : '');
          el.style.left = node.x + 'px';
          el.style.top = node.y + 'px';
          el.style.borderColor = node.color || '#38bdf8';
          el.dataset.id = node.id;

          const indicators = [];
          if (node.notes) indicators.push('📝');
          if (node.code) indicators.push(`💻 ${node.codeLang || 'Code'}`);
          if (node.image) indicators.push('🖼️');
          if (node.gitLogs && node.gitLogs.length) indicators.push(`🔀 ${node.gitLogs.length}`);

          el.innerHTML = `
            <div class="node-header">
              <span class="node-badge" style="color:${node.color};">${this.escapeHTML(node.status || 'Idea')}</span>
            </div>
            <div class="node-title">${this.escapeHTML(node.title)}</div>
            ${indicators.length ? `<div class="node-indicators">${indicators.join(' · ')}</div>` : ''}
          `;

          // Dragging & Clicking
          let isDragging = false, startX, startY, origX, origY;
          el.onmousedown = (e) => {
            e.stopPropagation();
            isDragging = false;
            startX = e.clientX; startY = e.clientY;
            origX = node.x; origY = node.y;

            const onMove = (ev) => {
              const dx = (ev.clientX - startX) / this.state.zoom;
              const dy = (ev.clientY - startY) / this.state.zoom;
              if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDragging = true;
              if (isDragging) {
                node.x = origX + dx;
                node.y = origY + dy;
                el.style.left = node.x + 'px';
                el.style.top = node.y + 'px';
                this.renderConnections();
              }
            };
            const onUp = () => {
              window.removeEventListener('mousemove', onMove);
              window.removeEventListener('mouseup', onUp);
              if (isDragging) {
                this.touchMapModified();
                this.saveState();
              } else {
                this.selectNode(node.id);
              }
            };
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
          };

          layer.appendChild(el);
        });
      },

      renderConnections() {
        const svg = document.getElementById('connections-svg');
        svg.innerHTML = '';
        const map = this.getActiveMap();
        if (!map) return;

        map.nodes.forEach(node => {
          if (!node.parentId) return;
          const parent = map.nodes.find(p => p.id === node.parentId);
          if (!parent) return;

          const x1 = parent.x + 160, y1 = parent.y + 32;
          const x2 = node.x, y2 = node.y + 32;
          const cx = (x1 + x2) / 2;

          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', `M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`);
          path.setAttribute('stroke', node.color || '#38bdf8');
          path.setAttribute('stroke-width', '2.4');
          path.setAttribute('fill', 'none');
          svg.appendChild(path);
        });
      },

      // Pan, Zoom, Search, Backup
      bindCanvasEvents() {
        const container = document.getElementById('canvas-container');
        let panning = false, sx, sy;
        container.onmousedown = (e) => {
          if (e.target.closest('.mm-node')) return;
          panning = true;
          sx = e.clientX - this.state.pan.x;
          sy = e.clientY - this.state.pan.y;
        };
        window.addEventListener('mousemove', (e) => {
          if (!panning) return;
          this.state.pan.x = e.clientX - sx;
          this.state.pan.y = e.clientY - sy;
          this.applyTransform();
        });
        window.addEventListener('mouseup', () => { panning = false; });
        container.onwheel = (e) => {
          e.preventDefault();
          this.zoom(e.deltaY < 0 ? 0.08 : -0.08);
        };
      },

      zoom(delta) {
        this.state.zoom = Math.min(2, Math.max(0.35, this.state.zoom + delta));
        this.applyTransform();
      },

      resetView() {
        this.state.pan = { x: 80, y: 80 };
        this.state.zoom = 1;
        this.applyTransform();
      },

      applyTransform() {
        document.getElementById('viewport').style.transform =
          `translate(${this.state.pan.x}px, ${this.state.pan.y}px) scale(${this.state.zoom})`;
      },

      searchNodes(query) {
        const q = query.toLowerCase().trim();
        const map = this.getActiveMap();
        document.querySelectorAll('.mm-node').forEach(el => {
          const node = map.nodes.find(n => n.id === el.dataset.id);
          const match = q && node && (
            node.title.toLowerCase().includes(q) ||
            (node.notes && node.notes.toLowerCase().includes(q)) ||
            (node.code && node.code.toLowerCase().includes(q))
          );
          el.classList.toggle('search-match', !!match);
        });
      },

      bindKeyboardShortcuts() {
        window.addEventListener('keydown', (e) => {
          if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
          if (e.key === 'Tab') { e.preventDefault(); this.addChildNode(); }
          if (e.key === 'Enter') { e.preventDefault(); this.addSiblingNode(); }
          if (e.key === 'Delete') { this.deleteSelectedNode(); }
        });
      },

      toggleTheme() {
        document.body.classList.toggle('light-theme');
        this.state.theme = document.body.classList.contains('light-theme') ? 'light' : 'dark';
        this.saveState();
      },

      openCloudModal() { document.getElementById('cloud-modal').classList.add('open'); },
      closeModal(id) { document.getElementById(id).classList.remove('open'); },

      exportJSON() {
        const blob = new Blob([JSON.stringify(this.state, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `thinking-flow-backup-${Date.now()}.json`;
        a.click();
      },

      importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (data.maps) {
              Object.assign(this.state, data);
              this.saveState();
              this.populateLanguageDropdown();
              this.renderAll();
              alert("Backup restored successfully!");
            }
          } catch (err) { alert("Invalid JSON file."); }
        };
        reader.readAsText(file);
      },

      saveCloudConfig() {
        localStorage.setItem('thinking_flow_cloud_cfg', document.getElementById('firebase-config-input').value);
        alert("Cloud configuration saved locally!");
      },

      escapeHTML(str) {
        return String(str || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
